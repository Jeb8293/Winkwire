<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Wink Wire Electronics</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script>
    (function(){
      var match = location.pathname.match(/^\/products\/([^\/]+)\/?$/i);
      if (match) {
        location.replace('/product.html?handle=' + encodeURIComponent(decodeURIComponent(match[1])));
      }
    })();
  </script>
</head>
<body>
  <main class="not-found">
    <span class="kicker">404</span>
    <h1>We couldn’t find that page.</h1>
    <p>The address may have changed. You can return to the store, review customer policies, or contact us for help.</p>
    <div class="hero-actions"><a class="btn primary" href="/shop.html">Shop products</a><a class="btn ghost" href="/contact.html">Contact us</a></div>
  </main>
</body>
</html>
